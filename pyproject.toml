[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "any-analysis"
dynamic = ["version"]
description = 'a backend analysis interface for `any-capture`, designed to simplify packet analysis.'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [{ name = "AhAlpha" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["alptools", "websockets>=14"]

[tool.hatch.version]
path = "src/any_analysis/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/any_analysis"]
